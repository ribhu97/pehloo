[project]
name = "pehloo"
version = "0.1.0"
description = "Automated multi-persona UX testing tool"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12",
    "browser-use>=0.1",
    "openai>=1.0",
    "langchain-openai>=0.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "torch>=2.11.0",
    "accelerate>=1.13.0",
    "questionary>=2.1.1",
]

[project.scripts]
pehloo = "pehloo.entrypoints.cli:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
